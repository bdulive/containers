services:
  rabbitmq:
    # Published as insightfinderinc/bitnami-rabbitmq:4.3.5-wolfi-r1
    # (linux/amd64 + linux/arm64). Building from this directory produces the
    # same image; compose reuses the local one once it exists.
    build:
      context: .
    image: insightfinderinc/bitnami-rabbitmq:4.3.5-wolfi-r1
    ports:
      - '4369:4369'
      - '5551:5551'
      - '5552:5552'
      - '5672:5672'
      - '25672:25672'
      - '15672:15672'
    environment:
      - RABBITMQ_SECURE_PASSWORD=yes
      - RABBITMQ_LOGS=-
    volumes:
      - 'rabbitmq_data:/bitnami/rabbitmq/mnesia'
volumes:
  rabbitmq_data:
    driver: local
