services:
  rabbitmq:
    # Built and verified locally as
    # insightfinderinc/bitnami-rabbitmq:4.3.6-wolfi-r0; not yet pushed.
    # Building from this directory produces it; compose reuses the local one.
    build:
      context: .
    image: insightfinderinc/bitnami-rabbitmq:4.3.6-wolfi-r0
    ports:
      - '4369:4369'
      - '5551:5551'
      - '5552:5552'
      - '5672:5672'
      - '25672:25672'
      - '15672:15672'
    environment:
      - RABBITMQ_SECURE_PASSWORD=yes
      - RABBITMQ_LOGS=-
    volumes:
      - 'rabbitmq_data:/bitnami/rabbitmq/mnesia'
volumes:
  rabbitmq_data:
    driver: local
